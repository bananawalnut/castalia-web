name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Install pinned Rust/WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static
  contracts-and-unit:
    name: contracts-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Install pinned Rust/WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm verify:contracts
  build-and-budgets:
    name: build-and-budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Install pinned Rust/WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm budgets:build
      - name: Require reviewed production issuer trust
        env:
          ISSUER_KEY_ID: ${{ vars.CASTALIA_ZENITH_MEMBERSHIP_ISSUER_KEY_ID }}
          ISSUER_PUBLIC_KEY: ${{ vars.CASTALIA_ZENITH_MEMBERSHIP_ISSUER_PUBLIC_KEY }}
        run: |
          test -n "$ISSUER_KEY_ID"
          test -n "$ISSUER_PUBLIC_KEY"
      - name: Build production Web artifact
        env:
          VITE_APP_ENV: production
          CASTALIA_ZENITH_ISSUER_KEY_ID: ${{ vars.CASTALIA_ZENITH_MEMBERSHIP_ISSUER_KEY_ID }}
          CASTALIA_ZENITH_ISSUER_PUBLIC_KEY: ${{ vars.CASTALIA_ZENITH_MEMBERSHIP_ISSUER_PUBLIC_KEY }}
        run: pnpm --filter @castalia/web build
      - name: Add static route entries
        run: pnpm exec tsx scripts/generate-pages-route-entries.ts apps/web/dist
      - run: pnpm security:bundle
      - run: pnpm budgets:startup
      - name: Upload production Web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: castalia-web-production-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
  browser-a11y:
    name: browser-a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: corepack enable
      - name: Install pinned Rust/WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm browser:a11y
