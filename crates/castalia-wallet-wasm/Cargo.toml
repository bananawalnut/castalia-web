[package]
name = "castalia-wallet-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1.8.2"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core", "zeroize"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
subtle = "2"
thiserror = "2"
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
zeroize = { version = "1", features = ["derive"] }
